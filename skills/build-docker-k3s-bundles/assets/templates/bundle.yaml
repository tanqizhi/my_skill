api_version: bundle.codex/v1alpha1

bundle:
  name: replace-me
  version: 0.1.0
  content_scope: full
  package_mode: installable
  deploy_targets:
    - docker
  dependency_policy: layered
  offline: true

localization:
  report_language: zh-CN
  manual_language: zh-CN

documentation:
  deployment_report: reports/deployment-and-operations.md
  installation_guide: docs/installation-guide.zh-CN.md
  operations_guide: docs/operations-guide.zh-CN.md

platforms:
  - os: linux
    architecture: amd64

runtime:
  docker:
    enabled: true
    version: ""
    compose_version: ""
  k3s:
    enabled: false
    version: ""

cluster:
  nodes: []

installation:
  state_directory: state
  resume_enabled: true
  preserve_data_on_reinstall: true
  stages:
    - preflight
    - runtime
    - images
    - paas
    - dependency-init
    - saas-config
    - saas
    - exposure
    - health
    - report

uninstall:
  enabled: true
  entrypoint: install.sh
  resume_enabled: true
  preserve_data_by_default: true
  remove_images_by_default: false
  remove_runtime_by_default: false
  stages:
    - preflight
    - stop-saas
    - remove-saas
    - stop-paas
    - remove-paas
    - remove-exposure
    - remove-owned-nat
    - remove-generated-config
    - optional-images
    - optional-runtime
    - verify-retained-state
    - report

packages:
  requires: []

services: []

external_dependencies: []

saas_bootstrap:
  confirmation_required: true
  initialization_tasks: []
  configuration_checks: []

exposure:
  docker: []
  k3s_node_ports: []

firewall:
  enabled: false
  backend: auto
  table: nat
  parent_chain: PREROUTING
  managed_chain: ""
  reuse_existing_chain: true
  sync_all_cluster_nodes: true
  jump_position: append
  persistence: prompt
  on_node_failure: prompt
  rules: []

security:
  vulnerability_policy:
    block_severities:
      - critical
      - high
    allow_documented_exceptions: true
  require_digest: true
  generate_source_record: true

testing:
  levels:
    - static
    - package
  remote_execution_authorized: false
